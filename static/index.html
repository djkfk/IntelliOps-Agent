<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntelliOps Agent</title>
    <meta name="description" content="IntelliOps Agent：知识库问答与智能运维诊断">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23121318'/%3E%3Crect x='7' y='7' width='11' height='11' rx='2' fill='%23c4a574'/%3E%3Crect x='14' y='14' width='11' height='11' rx='2' fill='%23c4a574' fill-opacity='0.45'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.bunny.net">
    <link href="https://fonts.bunny.net/css?family=ibm-plex-mono:400,500|outfit:400,500,600,700" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/es/highlight.min.js"></script>
</head>
<body>
    <a class="skip-link" href="#messageInput">跳到输入框</a>
    <div class="stage-bed" aria-hidden="true">
        <div class="stage-bed-grid"></div>
        <svg class="stage-bed-radar" viewBox="0 0 640 640" fill="none">
            <circle cx="320" cy="320" r="86" />
            <circle cx="320" cy="320" r="168" />
            <circle cx="320" cy="320" r="248" />
            <circle cx="320" cy="320" r="312" stroke-dasharray="3 11" />
            <path d="M320 8v80M320 552v80M8 320h80M552 320h80" />
            <circle cx="320" cy="152" r="3.2" fill="currentColor" stroke="none" />
            <circle cx="468" cy="248" r="2.4" fill="currentColor" stroke="none" />
            <circle cx="214" cy="402" r="2.4" fill="currentColor" stroke="none" />
        </svg>
        <div class="stage-bed-mark">
            <span></span>
            <span></span>
        </div>
    </div>
    <div class="grain" aria-hidden="true"></div>

    <div class="app-layout" id="appLayout">
        <div class="sidebar-scrim" id="sidebarScrim" hidden></div>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand-mark" aria-hidden="true">
                    <span></span>
                    <span></span>
                </div>
                <div class="brand-copy">
                    <h1 class="sidebar-title">IntelliOps</h1>
                    <p class="brand-sub">Agent console</p>
                </div>
                <button type="button" class="icon-btn rail-close" id="sidebarCloseBtn" title="收起侧栏" aria-label="收起侧栏">
                    <i class="ph ph-caret-left"></i>
                </button>
            </div>

            <div class="sidebar-content">
                <button class="new-chat-btn" id="newChatBtn">
                    <i class="ph ph-plus"></i>
                    <span>新建对话</span>
                </button>

                <button class="ai-ops-top-btn" id="aiOpsSidebarBtn" title="运行智能运维诊断">
                    <i class="ph ph-radar"></i>
                    <span>运行诊断</span>
                </button>

                <div class="chat-history-section">
                    <div class="history-header">
                        <span>近期对话</span>
                    </div>
                    <div class="chat-history-list" id="chatHistoryList"></div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <button type="button" class="icon-btn" id="sidebarToggle" title="打开会话栏" aria-label="打开会话栏">
                    <i class="ph ph-sidebar-simple"></i>
                </button>
                <div class="topbar-status">
                    <span class="status-dot" aria-hidden="true"></span>
                    <span>服务就绪</span>
                    <span class="topbar-sep" aria-hidden="true"></span>
                    <span class="topbar-hint">Enter 发送 · Shift+Enter 换行</span>
                </div>
            </header>

            <div class="chat-container">
                <div class="welcome-greeting" id="welcomeGreeting">
                    <p class="stage-kicker">IntelliOps Agent</p>
                    <p class="stage-title">问系统，<em>不要猜</em></p>
                    <p class="stage-lead">知识库问答和告警诊断走同一条对话线，证据先于结论。</p>
                    <div class="prompt-rail" id="promptRail">
                        <button type="button" class="prompt-chip" data-prompt="CPU 使用率持续偏高，应该从哪几步排查？">CPU 偏高怎么查</button>
                        <button type="button" class="prompt-chip" data-prompt="知识库里告警处理流程是怎么写的？">查告警处理流程</button>
                        <button type="button" class="prompt-chip" data-prompt="快速对话和流式对话分别适合什么场景？">对比两种对话模式</button>
                    </div>
                </div>

                <div class="chat-messages" id="chatMessages"></div>

                <div class="chat-input-container">
                    <div class="input-group-wrapper">
                        <div class="input-wrapper" id="composerShell">
                            <textarea id="messageInput" class="message-input" rows="1" maxlength="1000" placeholder="描述现象、贴日志，或直接提问"></textarea>
                            <div class="input-bottom-bar">
                                <div class="tools-btn-wrapper">
                                    <button class="tools-btn" id="toolsBtn" title="更多选项" type="button">
                                        <i class="ph ph-plus-circle tools-icon"></i>
                                    </button>
                                    <div class="tools-menu" id="toolsMenu">
                                        <div class="tools-menu-item" id="uploadFileItem">
                                            <i class="ph ph-upload-simple"></i>
                                            <span>上传到知识库</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="right-actions">
                                    <div class="mode-selector-wrapper" id="modeSelectorBtn">
                                        <span id="currentModeText" class="visually-hidden">快速</span>
                                        <div class="mode-dropdown" id="modeDropdown">
                                            <button type="button" class="dropdown-item active" data-mode="quick">
                                                <span class="dropdown-item-main">快速</span>
                                            </button>
                                            <button type="button" class="dropdown-item" data-mode="stream">
                                                <span class="dropdown-item-main">流式</span>
                                            </button>
                                        </div>
                                    </div>
                                    <button class="send-btn-circle" id="sendButton" title="发送" type="button">
                                        <i class="ph ph-arrow-up"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <input type="file" id="fileInput" accept=".txt,.md,.markdown" hidden>
                </div>
            </div>
        </main>
    </div>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div class="loading-text">正在写入知识库</div>
            <div class="loading-subtext">解析文档并建立索引</div>
        </div>
    </div>

    <div id="knowledgeModal" class="knowledge-modal" style="display: none;">
        <div class="knowledge-modal-backdrop" id="knowledgeModalBackdrop"></div>
        <div class="knowledge-modal-panel" role="dialog" aria-labelledby="knowledgeModalTitle">
            <div class="knowledge-modal-header">
                <h3 id="knowledgeModalTitle">沉淀为知识点</h3>
                <button type="button" class="knowledge-modal-close" id="knowledgeModalClose" title="关闭" aria-label="关闭">
                    <i class="ph ph-x"></i>
                </button>
            </div>
            <div class="knowledge-modal-body">
                <label class="knowledge-field-label" for="knowledgeTitleInput">标题</label>
                <input type="text" id="knowledgeTitleInput" class="knowledge-title-input" maxlength="80" placeholder="知识点标题">
                <label class="knowledge-field-label" for="knowledgeContentInput">FAQ 内容（可编辑）</label>
                <textarea id="knowledgeContentInput" class="knowledge-content-input" rows="14" placeholder="正在生成草稿"></textarea>
            </div>
            <div class="knowledge-modal-footer">
                <button type="button" class="knowledge-btn knowledge-btn-secondary" id="knowledgeCancelBtn">取消</button>
                <button type="button" class="knowledge-btn knowledge-btn-primary" id="knowledgeConfirmBtn">确认入库</button>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
